services:
  template_of_sveltekit_application:
    build:
      args:
        DEBIAN__DOCKER_IMAGE__TAG__DATE: "${DEBIAN__DOCKER_IMAGE__TAG__DATE}"
        HOSTING__BASE_PATH: "${HOSTING__BASE_PATH}"
        NODE_JS__VERSION: "${NODE_JS__VERSION}"
      context: "."
      dockerfile: "Dockerfile"
    depends_on: {}
    env_file:
      - path: ".env"
        required: false
    environment:
      ADAPTER__NAME: "Node"
      ADAPTER__SERVER__BIND__ADDRESS: "0.0.0.0"
      ADAPTER__SERVER__BIND__PORT__NUMBER: "5173"
      ADAPTER__SERVER__BIND__PORT__TLS__IS_ENABLED: "no"
      ADAPTER__SERVER__IS_ENABLED: "yes"
      ADAPTER__SHOULD_BE_USED: "yes"
      MODE_OF_OPERATION: "dynamic"
    ports:
      - "5173:5173"
    working_dir: "/home/runner/template-of-sveltekit-application"
volumes: {}
