<!doctype html>
<html lang=""
	><head
		><meta charset="utf-8" /><meta
			content="width=device-width, initial-scale=1"
			name="viewport" />%sveltekit.head%<style>
			*,
			*::after,
			*::before {
				box-sizing: border-box;
			}
			body {
				display: block grid;
				margin: 0;
				overflow-wrap: anywhere;
			}
			button,
			input,
			select,
			textarea {
				font-family: inherit;
				font-size: inherit;
			}
			html {
				display: block grid;
				min-height: 100%;
				height: auto;
			}
			.sveltekit-body {
				display: block grid;
			}
		</style></head
	><body
		><div class="sveltekit-body">%sveltekit.body%</div></body
	></html
>
